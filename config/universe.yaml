# ETF universe (Phase 1, step 1.1b): panels fixed from the audit of 2026-09-21 (step 1.1).
#
# STATUS: panels and `inception` come from `etfcorr data check-universe` (yfinance, run on
# 2026-09-21). Names, the `futures_based` flags of UUP and DBC and overlap flags are still from
# v2 / memory (UNVERIFIED); step 1.1 revision 2 adds the vendor name to the audit so names can be
# compared with the vendor's.
#
# Panel rules (decided by the project owner on 2026-09-21, applied identically to every ticker):
#   core     = ETF-like, first vendor row at or before the download start (+ 7 days), and median
#              daily dollar volume >= min_adv_usd over the last 252 sessions of the audit.
#              Effect: one common core sample from 2014-01-02, covering the whole 2016-2020
#              training split.
#   extended = (a) v2's "Extended / optional" list, and (b) candidates that fail a core
#              condition (short history, thin trading), plus futures-based funds and the crypto
#              series. Six of group (a) passed both core conditions in the 2026-09-21 audit (VDE,
#              PBW, NLR, IHF, REMX, PICK). Extended tickers are analysed as separate sub-panels
#              over their own common periods; they never shorten the core.
#   control  = market / macro controls (not themes).
#
# UPDATE 2026-09-28 (Question 3, docs/DECISION_LOG.md): IHF and REMX promoted from extended to
# core -- the two of the six eligible candidates with the lowest measured mean weighted-Jaccard
# holdings overlap against their own sector's existing core members (IHF 0.0276 vs XLV/IBB/XBI/IHI;
# REMX 0.0108 vs GDX/GDXJ/XME/COPX/SIL; real overlap from data/external/overlap_matrix.parquet via
# scripts/check_overlap_pairs.py, not from memory). VDE, PBW, NLR and PICK stay extended (higher
# measured overlap or, for PICK, a smaller overlap margin than REMX/IHF). Core N: 23 -> 25 (T
# unchanged at each horizon). Quarterly q=N/T rises 23/49=0.4694 -> 25/49=0.5102 -- still short of
# q=1 (singular) but remains in the ill-conditioned, exploratory-only regime already flagged above.
# Moved out of core in 1.1b: BOTZ, AIQ, BLOK, ARKF, FINX (history starts 2016-2019, after the
# 2014 download start) and QCLN (median dollar volume 5.5M USD < 10M USD). Their v2 rows said
# "core"; the deviation is a decision-log entry in docs/STATUS.md. Fintech/crypto therefore has
# no core member: it is analysed as extended sub-panels only.
# `inception` = first row of the vendor download, filled only where it is later than
# `start_date` (a lower bound on the true launch date, not the launch date itself).
# GLD appears in both the metals and the control rows of v2; it is kept once, as a control.
# Overlap flags list only the overlaps that v2 states (SMH/SOXX, ICLN/TAN/QCLN); the measured
# holdings overlap comes from Phase 2 (`holdings.py`). By convention the later ticker points to
# the earlier ones.
# Validated by etfcorr.config.UniverseConfig.
version: 1
start_date: "2014-01-01"      # download start; earlier than the first split to allow window warm-up
min_adv_usd: 10000000         # median daily dollar volume screen for core/extended ETFs (step 1.1)

